<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nuestra boda</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="¡Nos casamos!">
<meta property="og:description" content="Abre tu invitación">
<meta property="og:image" content="img/portada.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<script src="datos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--fondo:#F6F1E7;--tarjeta:#FFFDF8;--acento:#3E5641;--dorado:#B8925A;--texto:#2E2A24}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--texto);font:400 19px/1.55 "Cormorant Garamond",serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.cerrado{overflow:hidden;height:100vh}
.wrap{max-width:520px;margin:0 auto;position:relative}
img{display:block;max-width:100%}
h2{font:500 40px/1.1 "Cormorant Garamond";margin:0 0 6px;text-align:center}
.mini{font:600 12px "Cinzel";letter-spacing:.22em;text-transform:uppercase;color:var(--dorado);text-align:center}
.sub{text-align:center;font-style:italic;color:#6b6458;margin:0 0 18px}
.linea{width:70px;height:1px;background:var(--dorado);margin:14px auto}
section{padding:56px 26px;position:relative}
.btn{display:inline-block;border:0;border-radius:6px;background:var(--acento);color:#fff;font:500 16px "Cormorant Garamond";letter-spacing:.06em;padding:12px 28px;text-decoration:none;cursor:pointer}
.btn.borde{background:transparent;color:var(--acento);border:1px solid var(--acento)}
.centro{text-align:center}
.card{background:var(--tarjeta);border-radius:18px;padding:34px 24px;box-shadow:0 18px 40px rgba(40,30,10,.10);text-align:center;margin:0 auto 22px;position:relative}
.ico{width:64px;height:64px;margin:0 auto 10px;color:var(--dorado)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}
.rv.si{opacity:1;transform:none}
/* sobre de entrada */
#sobre{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--fondo);transition:opacity .9s ease,visibility .9s}
#sobre.fuera{opacity:0;visibility:hidden}
#sobre .env{position:relative;width:min(84vw,380px);aspect-ratio:1.45;background:var(--tarjeta);border-radius:10px;box-shadow:0 30px 60px rgba(40,30,10,.18);overflow:hidden}
#sobre .tapa{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(160deg,#efe6d6,#e6dac4);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s ease;z-index:2}
#sobre.abre .tapa{transform:rotateX(180deg)}
#sobre .sello{position:absolute;left:50%;top:62%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--dorado),var(--acento));color:#fff;display:grid;place-items:center;font:400 30px "Pinyon Script";z-index:3;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer}
#sobre p{margin-top:28px;text-align:center;font:600 13px "Cinzel";letter-spacing:.25em;color:var(--dorado);animation:lat 1.6s infinite}
@keyframes lat{50%{opacity:.35}}
/* portada */
#portada{min-height:100svh;padding:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden}
#portada .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center;transform:scale(1.08);animation:kb 18s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
#portada:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.45) 60%,rgba(0,0,0,.6))}
#portada .in{position:relative;z-index:2;padding:0 20px}
.nombres{font:400 76px/.95 "Pinyon Script"}
.nombres i{display:block;font:italic 400 34px "Cormorant Garamond";margin:6px 0}
#portada .linea{background:#fff;opacity:.7}
#portada h1{font:500 30px "Cormorant Garamond";margin:6px 0 10px}
#portada .fr{font-style:italic;font-size:19px;opacity:.92}
.flecha{position:absolute;bottom:26px;left:50%;z-index:2;width:28px;height:28px;margin-left:-14px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);animation:baja 1.8s infinite}
@keyframes baja{50%{transform:translateY(8px) rotate(45deg)}}
/* guirnalda */
.guir{height:96px;margin:0 -26px;overflow:hidden}
.guir svg{width:100%;height:100%}
/* raspar */
.circs{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;max-width:320px;margin:0 auto}
.circ{position:relative;width:136px;height:136px;border-radius:50%;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.10);display:flex;flex-direction:column;align-items:center;justify-content:center}
.circ b{font:500 40px/1 "Cormorant Garamond"}
.circ small{font:600 10px "Cinzel";letter-spacing:.2em;color:#8a8170;margin-top:4px}
.circ canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;touch-action:none;cursor:grab}
/* cuenta */
.cuenta{display:flex;justify-content:center;gap:0;margin-top:8px}
.cuenta div{padding:0 16px;text-align:center;border-left:1px solid #d8ccb4}
.cuenta div:first-child{border:0}
.cuenta b{display:block;font:500 42px/1 "Cormorant Garamond"}
.cuenta small{color:#8a8170}
.corazon{width:34px;margin:18px auto 0;color:var(--dorado);animation:late 1.2s infinite}
@keyframes late{30%{transform:scale(1.18)}}
/* eventos */
.cal{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0}
.cal span{font:600 13px "Cinzel";letter-spacing:.15em;border-top:1px solid var(--dorado);border-bottom:1px solid var(--dorado);padding:6px 4px;min-width:84px}
.cal b{font:500 64px/1 "Cormorant Garamond"}
.card h3{font:600 26px "Cinzel";letter-spacing:.08em;margin:0;color:var(--acento)}
.dir{color:#6b6458;margin:6px 0 18px}
.acciones{display:flex;flex-direction:column;gap:10px;align-items:center}
/* familias */
.fam{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:center}
.fam p{margin:4px 0}
.pad p{margin:10px 0 0;text-align:center}
.pad span{display:block;font:600 11px "Cinzel";letter-spacing:.2em;color:var(--dorado)}
/* itinerario */
.iti{position:relative;max-width:360px;margin:0 auto;padding-left:28px}
.iti:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--dorado)}
.iti div{position:relative;padding:8px 0 16px}
.iti div:before{content:"";position:absolute;left:-25px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--fondo);border:2px solid var(--dorado)}
.iti b{font:600 13px "Cinzel";letter-spacing:.12em;color:var(--dorado);display:block}
/* galería */
.gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 26px 18px;margin:0 -26px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 78%;height:440px;object-fit:cover;border-radius:4px;scroll-snap-align:center;border:8px solid #fff;box-shadow:0 12px 28px rgba(0,0,0,.14);cursor:zoom-in}
.puntos{display:flex;justify-content:center;gap:8px}
.puntos i{width:7px;height:7px;border-radius:50%;background:#cfc3ad}
.puntos i.on{background:var(--acento)}
#lb{position:fixed;inset:0;z-index:90;background:rgba(10,10,10,.94);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:84vh;border-radius:4px}
#lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:24px;cursor:pointer}
/* tarjetas con botón */
.mods{display:grid;gap:22px}
/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(30,25,15,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal .card{width:100%;max-width:420px;max-height:88vh;overflow:auto;margin:0;padding-top:56px;outline:1px solid var(--dorado);outline-offset:-10px;animation:sube .35s ease}
@keyframes sube{from{transform:translateY(30px)}}
.modal .x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;border:0;background:var(--acento);color:#fff;font-size:20px;cursor:pointer}
.modal ul{text-align:left;padding-left:20px}
.modal li{margin:8px 0}
.paleta{display:flex;justify-content:center;gap:10px;margin:14px 0}
.paleta i{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.15)}
form{display:flex;flex-direction:column;gap:12px;text-align:left}
label{font:600 11px "Cinzel";letter-spacing:.15em;color:#8a8170}
input,select,textarea{width:100%;font:400 18px "Cormorant Garamond";padding:10px 4px;border:0;border-bottom:1px solid #cbbd9f;background:transparent;color:var(--texto);outline:none}
.opc{display:flex;gap:10px}
.opc label{flex:1;text-align:center;border:1px solid #cbbd9f;border-radius:8px;padding:10px;cursor:pointer;font:500 17px "Cormorant Garamond";letter-spacing:0;color:var(--texto)}
.opc input{display:none}
.opc input:checked+span{color:var(--acento);font-weight:600}
.opc label:has(input:checked){border-color:var(--acento);background:rgba(62,86,65,.07)}
.dato{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--fondo);border-radius:10px;padding:10px 14px;margin:8px 0;text-align:left}
.dato button{border:0;background:var(--acento);color:#fff;border-radius:6px;padding:6px 12px;font:500 14px "Cormorant Garamond";cursor:pointer}
/* QR */
#qr{background:#fff;padding:14px;border-radius:10px;display:inline-block;margin:10px 0 16px}
/* foto con fondo */
.fotofondo{color:#fff;overflow:hidden}
.fotofondo .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.45)}
.fotofondo>*:not(.bg){position:relative}
/* cierre */
#cierre{text-align:center;padding-bottom:110px}
#cierre .nombres{color:var(--acento);font-size:64px}
.cred{margin-top:34px}
.cred a{display:inline-block;padding:10px 22px;border-radius:999px;border:1px solid var(--dorado);color:var(--acento);font:600 15px "Cormorant Garamond";letter-spacing:.06em;text-decoration:none;background:var(--tarjeta);box-shadow:0 6px 16px rgba(0,0,0,.06)}
.evit{display:block}
.sw{display:inline-flex;flex-direction:column;align-items:center;gap:6px;margin:0 12px}
.sw i{position:relative;width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 4px #d6cfc0;animation:pulso 2.2s ease-in-out infinite}
.sw i:after{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:#C0392B;border-radius:2px;transform:rotate(45deg)}
.sw small{font:600 12px "Cinzel";letter-spacing:.1em;color:#8a8170;font-style:normal}
@keyframes pulso{50%{transform:scale(1.08)}}
/* música */
#mus{position:fixed;right:16px;bottom:18px;z-index:70;width:54px;height:54px;border-radius:50%;border:0;background:var(--tarjeta);box-shadow:0 8px 20px rgba(0,0,0,.18);color:var(--acento);cursor:pointer;display:none;align-items:center;justify-content:center}
#mus.ver{display:flex}
#mus svg{width:24px}
#mus.play svg{animation:gira 4s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* pétalos */
.petalo{position:fixed;top:-20px;z-index:60;pointer-events:none;width:12px;height:16px;border-radius:12px 0 12px 0;background:#fff;opacity:.85;box-shadow:0 0 0 1px rgba(184,146,90,.2)}
/* movimiento */
body:not(.cerrado) #portada .in>*{animation:entra 1.1s cubic-bezier(.2,.7,.2,1) both}
body:not(.cerrado) #portada .in>*:nth-child(2){animation-delay:.35s}
body:not(.cerrado) #portada .in>*:nth-child(3){animation-delay:.6s}
body:not(.cerrado) #portada .in>*:nth-child(4){animation-delay:.8s}
@keyframes entra{from{opacity:0;transform:translateY(26px);filter:blur(6px)}}
#portada .linea{animation:crece 1.2s .5s both}
@keyframes crece{from{width:0}}
.guir svg{animation:mece 6s ease-in-out infinite;transform-origin:50% 0}
@keyframes mece{50%{transform:translateX(-6px) rotate(-.6deg)}}
.rv{transform:translateY(34px) scale(.97)}
.mods .card.rv:nth-child(2){transition-delay:.12s}.mods .card.rv:nth-child(3){transition-delay:.24s}
.btn{position:relative;overflow:hidden}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:brillo 4.5s ease-in-out infinite}
.btn.borde:after{display:none}
@keyframes brillo{0%,70%{left:-60%}100%{left:130%}}
.card .ico{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card.rv:not(.si) .ico{transform:scale(.6) rotate(-12deg)}
.cuenta b{display:inline-block}
.cuenta b.salta{animation:salta .45s ease}
@keyframes salta{40%{transform:translateY(-6px);color:var(--acento)}}
.fotofondo .bg{will-change:transform;transform:scale(1.15)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--acento);color:#fff;padding:10px 20px;border-radius:999px;font-size:16px;opacity:0;transition:opacity .3s;z-index:95}
#toast.on{opacity:1}
</style>
</head>
<body class="cerrado">
<div id="sobre"><div><div class="env"><div class="tapa"></div><div class="sello" id="sello"></div></div><p>TOCA EL SELLO PARA ABRIR</p></div></div>
<main class="wrap" id="app"></main>
<div id="lb"><button style="left:12px" data-d="-1">‹</button><img alt=""><button style="right:12px" data-d="1">›</button><button style="right:12px;top:16px" id="lbx">×</button></div>
<button id="mus" aria-label="Música"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18.5a2.5 2.5 0 1 1-2-2.45V5l12-2v11.5a2.5 2.5 0 1 1-2-2.45V7.2L9 8.6z"/></svg></button>
<div id="toast"></div>
<audio id="audio" loop preload="auto"></audio>
<script>
const B=window.BODA, $=s=>document.querySelector(s), app=$('#app');
const r=document.documentElement.style;for(const k in B.tema)r.setProperty('--'+k,B.tema[k]);
const F=new Date(B.fecha);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const ini=(B.novia[0]||'')+' & '+(B.novio[0]||'');
document.title=`${B.novia} & ${B.novio} · Nuestra boda`;
$('#sello').textContent=ini.replace(/ /g,'');
const wa=(txt)=>`https://wa.me/${B.whatsapp}?text=${encodeURIComponent(txt)}`;
const ICON={
 anillos:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><circle cx="24" cy="38" r="14"/><circle cx="40" cy="38" r="14"/><path d="M20 22l4-8 4 8M24 14v-4"/></svg>',
 copas:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 10h14l-2 16a5 5 0 0 1-10 0zM36 10h14l-2 16a5 5 0 0 1-10 0zM21 31v16M43 31v16M15 47h12M37 47h12M28 6l4 4 4-4"/></svg>',
 camara:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><rect x="12" y="18" width="40" height="32" rx="4"/><circle cx="32" cy="34" r="9"/><path d="M24 18l3-6h10l3 6"/></svg>',
 musica:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M24 44V14l26-5v30"/><circle cx="18" cy="44" r="6"/><circle cx="44" cy="39" r="6"/><path d="M24 22l26-5"/></svg>',
 mono:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M32 32L10 20v24zM32 32l22-12v24z"/><circle cx="32" cy="32" r="4"/></svg>',
 notas:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><rect x="16" y="12" width="32" height="42" rx="3"/><path d="M26 12v-4h12v4M24 34l6 6 11-12"/></svg>',
 regalo:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><rect x="12" y="26" width="40" height="28"/><rect x="9" y="18" width="46" height="8"/><path d="M32 18v36M32 18c-6-10-16-6-10 0M32 18c6-10 16-6 10 0"/></svg>',
 lista:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3"><path d="M10 18l4 4 8-8M10 34l4 4 8-8M10 50h4M28 18h26M28 34h26M28 50h26"/></svg>',
 biblia:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 10h30a6 6 0 0 1 6 6v38H20a6 6 0 0 1-6-6zM14 48a6 6 0 0 1 6-6h30M32 18v16M25 24h14"/></svg>',
 pastel:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 54V40h36v14zM18 40V30h28v10zM23 30v-8h18v8M10 54h44M32 22v-6M32 16c-2-2-2-5 0-7 2 2 2 5 0 7M14 46c4 3 8 3 12 0s8-3 12 0 8 3 12 0"/></svg>',
 corazon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.3-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.7 12 21 12 21z"/></svg>'
};
// guirnalda de rosas blancas dibujada a mano (SVG)
function guirnalda(flip){
  let s=`<svg viewBox="0 0 520 96" preserveAspectRatio="xMidYMid slice"${flip?' style="transform:scaleY(-1)"':''}>`;
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<34;i++){const x=rnd()*540-10,y=20+rnd()*40,a=rnd()*360;
    s+=`<ellipse cx="${x}" cy="${y}" rx="20" ry="7" fill="${rnd()>.5?'#6F8565':'#4F6B4A'}" transform="rotate(${a} ${x} ${y})" opacity=".9"/>`}
  for(let i=0;i<20;i++){const x=i*27+rnd()*12-6,y=26+rnd()*30,R=13+rnd()*8;
    s+=`<g transform="translate(${x} ${y})"><circle r="${R}" fill="#FBF8F1" stroke="#E2D9C6"/>`;
    for(let k=0;k<5;k++){const rr=R*(.85-k*.16);s+=`<circle r="${rr}" cx="${(k%2?1:-1)*rr*.18}" cy="${rr*.12}" fill="none" stroke="#D9CFBA" stroke-width="1.1"/>`}
    s+=`<circle r="${R*.18}" fill="#EFE6D3"/></g>`}
  for(let i=0;i<26;i++){const x=rnd()*520,y=12+rnd()*64;s+=`<circle cx="${x}" cy="${y}" r="${2+rnd()*2}" fill="#fff" stroke="#E8DFCC"/>`}
  return s+'</svg>';
}
const G=f=>`<div class="guir">${guirnalda(f)}</div>`;
let h='';
// portada
h+=`<section id="portada">${B.portadaVideo?`<video class="bg" src="${B.portadaVideo}" poster="${B.portada}" autoplay muted loop playsinline preload="auto"></video>`:`<div class="bg" style="background-image:url('${B.portada}')"></div>`}<div class="in">
 <div class="nombres">${B.novia}<i>&amp;</i>${B.novio}</div><div class="linea"></div><h1>¡Nuestra boda!</h1><div class="fr">${B.frase}</div></div><div class="flecha"></div></section>`;
// versículo
if(B.versiculo&&B.versiculo.texto)h+=`<section class="centro rv" style="padding-top:64px"><div class="ico" style="width:46px;height:46px">${ICON.biblia}</div><p style="font:italic 400 25px/1.45 'Cormorant Garamond';max-width:400px;margin:0 auto">“${B.versiculo.texto}”</p><div class="linea"></div><p class="mini">${B.versiculo.cita}</p></section>`;
// raspar la fecha
const DF=[[F.getDate(),'DÍA'],[MESES[F.getMonth()],'MES'],[F.getFullYear(),'AÑO']];
h+=`<section>${G()}<div class="rv"><h2>Ver la fecha</h2><div class="linea"></div><p class="mini" style="margin-bottom:22px">Rasca los tres círculos para descubrir la fecha</p>
 <div class="circs">${DF.map(([v,l])=>`<div class="circ"><b style="${String(v).length>4?'font-size:26px':''}">${v}</b><small>${l}</small><canvas width="272" height="272"></canvas></div>`).join('')}</div></div>${G(1)}</section>`;
// cuenta regresiva
h+=`<section class="centro rv"><h2>Faltan</h2><div class="linea"></div><div class="cuenta" id="cuenta"></div><div class="corazon">${ICON.corazon}</div></section>`;
// padres y padrinos
if(B.padres&&(B.padres.novia.length||B.padres.novio.length)){
 h+=`<section class="rv"><p class="mini">${B.padres.encabezado||'Con la bendición de Dios y de nuestros padres'}</p><div class="linea"></div><div class="fam">
 <div><p class="mini">${B.padres.tituloNovia||'Padres de la novia'}</p>${B.padres.novia.map(p=>`<p>${p}</p>`).join('')}</div><div><p class="mini">${B.padres.tituloNovio||'Padres del novio'}</p>${B.padres.novio.map(p=>`<p>${p}</p>`).join('')}</div></div>
 ${B.padrinos&&B.padrinos.length?`<div class="linea" style="margin-top:28px"></div><p class="mini">Nuestros padrinos</p><div class="pad">${B.padrinos.map(([t,n])=>`<p><span>${t}</span>${n}</p>`).join('')}</div>`:''}</section>`;
}
// eventos
const gcal=ev=>{const d=new Date(F);const f=x=>x.toISOString().replace(/[-:]|\.\d{3}/g,'');const e=new Date(d.getTime()+6*3600e3);
 return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('Boda '+B.novia+' & '+B.novio)}&dates=${f(d)}/${f(e)}&location=${encodeURIComponent(ev.lugar+', '+ev.direccion)}`};
h+=`<section class="fotofondo"><div class="bg" style="background-image:url('${B.galeria.fotos[0]||B.portada}')"></div>${B.eventos.map((ev,i)=>`<div class="card rv" style="color:var(--texto)">
 <div class="ico">${ICON[ev.icono]||ICON.anillos}</div><h3>${ev.tipo.toUpperCase()}</h3><div class="linea"></div><p class="mini">${MESES[F.getMonth()]}</p>
 <div class="cal"><span>${DIAS[F.getDay()].toUpperCase()}</span><b>${F.getDate()}</b><span>${ev.hora}</span></div><p class="mini" style="color:var(--texto)">${F.getFullYear()}</p>
 <p style="font-size:21px;margin:14px 0 0;font-weight:600">${ev.lugar}</p><p class="dir">${ev.direccion}</p>
 <div class="acciones"><a class="btn" href="${ev.mapa}" target="_blank" rel="noopener">¿Cómo llegar?</a>${i===0?`<a class="btn borde" href="${gcal(ev)}" target="_blank" rel="noopener">Agregar al calendario</a>`:''}</div></div>`).join('')}</section>`;
// itinerario
if(B.itinerario&&B.itinerario.length)h+=`<section class="rv">${G()}<h2>Itinerario</h2><div class="linea"></div><div class="iti">${B.itinerario.map(([t,a])=>`<div><b>${t}</b>${a}</div>`).join('')}</div></section>`;
// galería
if(B.galeria.fotos.length)h+=`<section class="rv"><h2>${B.galeria.titulo}</h2><p class="sub">${B.galeria.subtitulo}</p><div class="ico" style="width:44px;height:44px">${ICON.camara}</div>
 <div class="gal" id="gal">${B.galeria.fotos.map((f,i)=>`<img src="${f}" alt="Foto ${i+1}" data-i="${i}" loading="lazy">`).join('')}</div><div class="puntos" id="pts">${B.galeria.fotos.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></section>`;
// tarjetas con modal
const evitar=()=>{const e=(B.dressCode||{}).evitar||[];return e.length?`<span class="evit"><span class="mini" style="display:block;margin:14px 0 8px">Evita estos colores</span>${e.map(([c,n])=>`<span class="sw"><i style="background:${c}"></i><small>${n}</small></span>`).join('')}</span>`:''};
const mods=[];
if(B.sugerirCancion!==false)mods.push(['musica','Música','¿Cuál es la canción que no puede faltar en la fiesta?','Sugerir canción','m-musica']);
if(B.dressCode&&B.dressCode.titulo)mods.push(['mono','Dress Code',(B.dressCode.titulo?`<b style="font-style:normal;color:var(--texto)">${B.dressCode.titulo}</b><br>`:'')+'Una orientación para tu vestimenta'+evitar(),'Ver más','m-dress']);
if(B.notas&&B.notas.length)mods.push(['notas','Tips y Notas','Información adicional a considerar','Ver más','m-notas']);
if(B.regalos)mods.push(['regalo','Regalos','Si deseas regalarnos algo, aquí van algunas ideas','Ver más','m-regalos']);
h+=`<section>${G()}<div class="mods">${mods.map(([ic,t,s,b,id])=>`<div class="card rv"><h2 style="font-size:32px">${t}</h2><div class="ico">${ICON[ic]}</div><p class="sub">${s}</p><button class="btn" data-m="${id}">${b}</button></div>`).join('')}</div></section>`;
// fotos QR
if(B.fotosQR&&B.fotosQR.link)h+=`<section class="fotofondo centro"><div class="bg" style="background-image:url('${B.galeria.fotos[1]||B.portada}')"></div><h2 class="rv">Compartimos este día junto a ti</h2><p class="rv" style="font-style:italic">${B.fotosQR.texto}</p>
 <div id="qr" class="rv"></div><p class="rv">Escanea el código y sube tus fotos</p><a class="btn rv" href="${B.fotosQR.link}" target="_blank" rel="noopener">Subir fotos</a></section>`;
// confirmación
h+=`<section class="centro rv">${G()}<h2>Confirmación</h2><p class="sub">¿Nos acompañas en este día tan especial?</p><div class="ico" style="color:var(--acento)">${ICON.lista}</div>
 ${B.confirmarAntes?`<p>Por favor confirma antes del <b>${B.confirmarAntes}</b></p>`:''}<button class="btn" data-m="m-rsvp">Confirmar asistencia</button></section>`;
// cierre
h+=`<section id="cierre" class="rv">${G(1)}<div class="nombres">${B.novia}<i>&amp;</i>${B.novio}</div><div class="linea"></div><p style="font-size:24px">¡Los esperamos!</p>${B.hashtag?`<p class="mini">${B.hashtag}</p>`:''}${B.credito?`<p class="cred">${B.creditoLink?`<a href="${B.creditoLink}" target="_blank" rel="noopener">${B.credito}</a>`:B.credito}</p>`:''}</section>`;
// modales
const R=B.regalos||{};
h+=`<div class="modal" id="m-musica"><div class="card"><button class="x">×</button><div class="ico">${ICON.musica}</div><h2 style="font-size:32px">Sugerir canción</h2>
 <form data-tipo="cancion"><label>Tu nombre<input name="n" required></label><label>Canción y artista<input name="c" required></label><label>Link de YouTube (opcional)<input name="l"></label><button class="btn">Enviar sugerencia</button></form></div></div>`;
h+=`<div class="modal" id="m-dress"><div class="card"><button class="x">×</button><div class="ico">${ICON.mono}</div><h2 style="font-size:32px">Dress Code</h2><p class="mini">${(B.dressCode||{}).titulo||''}</p><p>${(B.dressCode||{}).texto||''}</p>
 ${evitar()}${(B.dressCode&&B.dressCode.colores||[]).length?`<p class="mini">Paleta sugerida</p><div class="paleta">${B.dressCode.colores.map(c=>`<i style="background:${c}"></i>`).join('')}</div>`:''}</div></div>`;
h+=`<div class="modal" id="m-notas"><div class="card"><button class="x">×</button><div class="ico">${ICON.notas}</div><h2 style="font-size:32px">Tips y Notas</h2><ul>${(B.notas||[]).map(n=>`<li>${n}</li>`).join('')}</ul></div></div>`;
h+=`<div class="modal" id="m-regalos"><div class="card"><button class="x">×</button><div class="ico">${ICON.regalo}</div><h2 style="font-size:32px">Regalos</h2><p>${R.texto||''}</p>
 ${(R.mesa||[]).map(([t,n,l])=>`<div class="dato"><span><b>${t}</b><br>${n}</span>${l?`<a class="btn" href="${l}" target="_blank" rel="noopener">Ver</a>`:''}</div>`).join('')}
 ${R.banco&&R.banco.clabe?`<p class="mini" style="margin-top:16px">Transferencia</p><div class="dato"><span><b>${R.banco.banco}</b><br>${R.banco.titular}<br>CLABE ${R.banco.clabe}</span><button data-copia="${R.banco.clabe}">Copiar</button></div>`:''}
 ${R.sobres?'<p style="margin-top:14px">También habrá un cofre para sobres el día del evento.</p>':''}</div></div>`;
h+=`<div class="modal" id="m-rsvp"><div class="card"><button class="x">×</button><div class="ico" style="color:var(--acento)">${ICON.lista}</div><h2 style="font-size:32px">Confirmar asistencia</h2>
 <form data-tipo="rsvp"><label>Nombre completo<input name="n" required></label>
 <div class="opc"><label><input type="radio" name="a" value="Sí asistiré" checked><span>Sí asistiré</span></label><label><input type="radio" name="a" value="No podré asistir"><span>No podré</span></label></div>
 <label>Número de personas<select name="p">${Array.from({length:B.pasesMax||4},(_,i)=>`<option>${i+1}</option>`).join('')}</select></label>
 <label>Mensaje para los novios (opcional)<textarea name="m" rows="2"></textarea></label><button class="btn">Enviar confirmación</button></form></div></div>`;
app.innerHTML=h;

// --- abrir el sobre y música ---
const audio=$('#audio'),mus=$('#mus');
if(B.musica){audio.src=B.musica}
$('#sobre').addEventListener('click',()=>{const s=$('#sobre');if(s.classList.contains('abre'))return;s.classList.add('abre');
  if(B.musica){audio.play().then(()=>mus.classList.add('play')).catch(()=>{});mus.classList.add('ver')}
  const v=document.querySelector('#portada video');if(v){v.currentTime=0;v.play().catch(()=>{})}
  setTimeout(()=>{s.classList.add('fuera');document.body.classList.remove('cerrado');petalos()},900)});
mus.onclick=()=>{if(audio.paused){audio.play();mus.classList.add('play')}else{audio.pause();mus.classList.remove('play')}};
// --- aparecer al hacer scroll ---
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('si');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
// --- raspar ---
let listos=0;
document.querySelectorAll('.circ canvas').forEach(cv=>{
  const c=cv.getContext('2d'),W=cv.width;
  const g=c.createRadialGradient(W*.35,W*.3,10,W/2,W/2,W/2);g.addColorStop(0,'#F4EFE6');g.addColorStop(1,'#D9D0C0');
  c.fillStyle=g;c.fillRect(0,0,W,W);c.fillStyle='#9c927f';c.font='600 26px Cinzel';c.textAlign='center';c.fillText('RASPE',W/2,W/2+9);
  let down=false,hecho=false;
  const pos=e=>{const b=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-b.left)*W/b.width,(p.clientY-b.top)*W/b.height]};
  const raspa=e=>{if(!down||hecho)return;e.preventDefault();const[x,y]=pos(e);c.globalCompositeOperation='destination-out';c.beginPath();c.arc(x,y,30,0,7);c.fill();
    const d=c.getImageData(0,0,W,W).data;let n=0;for(let i=3;i<d.length;i+=64)if(d[i]===0)n++;
    if(n/(d.length/64)>.45){hecho=true;cv.style.transition='opacity .5s';cv.style.opacity=0;setTimeout(()=>cv.remove(),500);if(++listos===3)confeti()}};
  cv.addEventListener('pointerdown',e=>{down=true;raspa(e)});cv.addEventListener('pointermove',raspa);
  addEventListener('pointerup',()=>down=false);cv.addEventListener('touchmove',raspa,{passive:false});
});
function confeti(){const cs=['#B8925A','#3E5641','#E8D9B5','#fff'];for(let i=0;i<70;i++){const p=document.createElement('i');p.className='petalo';
  p.style.cssText=`left:${50+Math.random()*10-5}vw;top:40vh;background:${cs[i%4]};width:8px;height:12px;border-radius:2px`;document.body.appendChild(p);
  p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${(Math.random()-.5)*90}vw,${(Math.random()*-30-10)}vh) rotate(${Math.random()*720}deg)`,opacity:1,offset:.4},{transform:`translate(${(Math.random()-.5)*110}vw,60vh) rotate(${Math.random()*1080}deg)`,opacity:0}],{duration:2600+Math.random()*1200,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove()}}
function petalos(){let k=0;const t=setInterval(()=>{if(++k>18)return clearInterval(t);const p=document.createElement('i');p.className='petalo';p.style.left=Math.random()*100+'vw';document.body.appendChild(p);
  p.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${(Math.random()-.5)*40}vw,110vh) rotate(${360+Math.random()*360}deg)`}],{duration:6000+Math.random()*4000,easing:'linear'}).onfinish=()=>p.remove()},350)}
// --- cuenta regresiva ---
const ct=$('#cuenta');
function tick(){let s=Math.max(0,(F-new Date())/1000);const d=Math.floor(s/86400),hh=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),se=Math.floor(s%60);
  const vals=[d,hh,m,se];if(!ct.children.length)ct.innerHTML=['Días','hs','min','seg'].map(l=>`<div><b></b><small>${l}</small></div>`).join('');
  ct.querySelectorAll('b').forEach((b,i)=>{if(b.textContent!==String(vals[i])){b.textContent=vals[i];b.classList.remove('salta');void b.offsetWidth;b.classList.add('salta')}})}
tick();setInterval(tick,1000);
// --- galería y visor ---
const gal=$('#gal');
if(gal){const imgs=[...gal.querySelectorAll('img')],pts=[...document.querySelectorAll('#pts i')];
  gal.addEventListener('scroll',()=>{const i=Math.round(gal.scrollLeft/(imgs[0].offsetWidth+14));pts.forEach((p,k)=>p.classList.toggle('on',k===i))});
  let cur=0;const lb=$('#lb'),li=lb.querySelector('img');const ver=i=>{cur=(i+imgs.length)%imgs.length;li.src=imgs[cur].src};
  imgs.forEach((im,i)=>im.onclick=()=>{ver(i);lb.classList.add('on')});
  lb.querySelectorAll('[data-d]').forEach(b=>b.onclick=e=>{e.stopPropagation();ver(cur+Number(b.dataset.d))});
  $('#lbx').onclick=()=>lb.classList.remove('on');lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')}
  let auto=true;['touchstart','pointerdown','wheel'].forEach(ev=>gal.addEventListener(ev,()=>auto=false,{passive:true}));
  setInterval(()=>{if(!auto||lb.classList.contains('on'))return;const r=gal.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
    const w=imgs[0].offsetWidth+14,i=Math.round(gal.scrollLeft/w);gal.scrollTo({left:((i+1)%imgs.length)*w,behavior:'smooth'})},3200)}
const fondos=[...document.querySelectorAll('.fotofondo .bg')];
addEventListener('scroll',()=>fondos.forEach(b=>{const r=b.parentElement.getBoundingClientRect();b.style.transform=`translateY(${(r.top+r.height/2-innerHeight/2)*-.12}px) scale(1.15)`}),{passive:true});
// --- modales ---
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>$('#'+b.dataset.m).classList.add('on'));
document.querySelectorAll('.modal').forEach(m=>{m.onclick=e=>{if(e.target===m||e.target.classList.contains('x'))m.classList.remove('on')}});
document.querySelectorAll('[data-copia]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.copia).then(()=>toast('CLABE copiada'))});
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1800)}
// --- formularios → WhatsApp de los novios ---
document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));let t;
  if(f.dataset.tipo==='rsvp')t=`¡Hola ${B.novia} y ${B.novio}! 💍\nConfirmación de asistencia:\n• Nombre: ${d.n}\n• ${d.a}\n• Personas: ${d.a.startsWith('No')?0:d.p}${d.m?`\n• Mensaje: ${d.m}`:''}`;
  else t=`¡Hola ${B.novia} y ${B.novio}! 🎶\nSugerencia de canción para la fiesta:\n• De: ${d.n}\n• Canción: ${d.c}${d.l?`\n• Link: ${d.l}`:''}`;
  window.open(wa(t),'_blank');f.closest('.modal').classList.remove('on');toast('¡Gracias!')});
// --- QR para subir fotos ---
if(B.fotosQR&&B.fotosQR.link&&window.QRCode)new QRCode($('#qr'),{text:B.fotosQR.link,width:170,height:170,colorDark:'#1d1d1d',colorLight:'#ffffff'});
</script>
</body>
</html>
